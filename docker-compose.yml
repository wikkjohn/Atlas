# Local development stack for ATLAS Global Bank.
#   docker compose up --build
# Frontend: http://localhost:5173   API: http://localhost:8000/api/docs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      ATLAS_ENVIRONMENT: development
      ATLAS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@postgres:5432/${POSTGRES_DB:-atlas}
      ATLAS_REDIS_URL: redis://redis:6379/0
      ATLAS_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ATLAS_LOG_FORMAT: ${ATLAS_LOG_FORMAT:-json}
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:-}
      ATLAS_DEMO_PASSWORD: ${ATLAS_DEMO_PASSWORD:-atlas-demo-password}
      # Background jobs run in the worker service below, not in the API process.
      ATLAS_JOBS_EXECUTION: worker
      ATLAS_SIMULATION_ARCHIVE_DIR: /app/var/simulation-archive
      ATLAS_SLOW_QUERY_MS: ${ATLAS_SLOW_QUERY_MS:-250}
      # Set to enable the Prometheus endpoint /api/metrics (bearer token).
      ATLAS_METRICS_TOKEN: ${ATLAS_METRICS_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      # Shared with the worker: either may archive or restore simulation history.
      - simulation-archive:/app/var/simulation-archive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    # Background jobs and their schedules: 4 processes, so a sharded simulation runs 4
    # shards at a time (more: ATLAS_WORKER_PROCESSES, or docker compose up --scale worker=N).
    build: ./backend
    command: ["sh", "-c", "exec python -m app.cli worker --processes ${ATLAS_WORKER_PROCESSES:-4}"]
    environment:
      ATLAS_ENVIRONMENT: development
      ATLAS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@postgres:5432/${POSTGRES_DB:-atlas}
      ATLAS_REDIS_URL: redis://redis:6379/0
      ATLAS_LOG_FORMAT: ${ATLAS_LOG_FORMAT:-json}
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:-}
      ATLAS_SIMULATION_ARCHIVE_DIR: /app/var/simulation-archive
      ATLAS_SLOW_QUERY_MS: ${ATLAS_SLOW_QUERY_MS:-250}
    volumes:
      - simulation-archive:/app/var/simulation-archive
    depends_on:
      backend:
        condition: service_healthy  # the backend applies the migrations on start

  frontend:
    build: ./frontend
    environment:
      ATLAS_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  simulation-archive:
